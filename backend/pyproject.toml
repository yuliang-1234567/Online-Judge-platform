[project]
name = "oj-platform-backend"
version = "0.1.0"
description = "OJ platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi<1",
    "uvicorn<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: explicit local Docker environment probes"]
addopts = "-ra --strict-markers -m 'not docker'"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pre-commit==4.7.0",
    "pytest>=9.1.1",
    "ruff==0.17.1",
]
