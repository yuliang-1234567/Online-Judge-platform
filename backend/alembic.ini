[alembic]
# here 以本配置文件所在目录为基准定位版本目录，避免随调用者工作目录漂移。
script_location = %(here)s/alembic
# Supplied exclusively by DATABASE_URL_SYNC; never store credentials here.
# 同步 URL 由 env.py 从进程环境直接读取，避免凭据落盘及 INI 对百分号编码的插值。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
# 日志走 stderr；离线 SQL 留在 stdout，重定向 SQL 时不会混入日志。
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
