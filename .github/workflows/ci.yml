name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

# CI 只读仓库，不需要写权限；checkout 也不保留凭据给后续步骤。
permissions:
  contents: read

# 同一工作流和 ref 的新运行取消旧运行，避免同一分支重复消耗执行资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 所有 run 步骤在 backend 中找项目与锁文件；任一步失败，后续普通步骤不继续。
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
      # --locked 防止 CI 临时改依赖解析结果；与本地 Makefile 使用同一份锁。
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      # 默认 pytest 排除 docker；CI 不启动 MySQL/Redis，不能据此声称实库验收通过。
      - name: Run tests
        run: uv run --locked pytest
